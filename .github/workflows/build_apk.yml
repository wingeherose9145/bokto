name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 改用最新稳定版 Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # 不指定固定版本，让它自动选择最新的
          
      - name: Build APK
        run: |
          cd my_video_player
          # 强制清理并重新获取依赖
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-private-player
          path: my_video_player/build/app/outputs/flutter-apk/app-release.apk