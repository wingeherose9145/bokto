name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Build APK
        run: |
          # 进入你的项目目录
          cd my_video_player
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-private-player
          path: my_video_player/build/app/outputs/flutter-apk/app-release.apk