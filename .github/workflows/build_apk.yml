name: Build APK
on: [push, workflow_dispatch] # 增加手动触发开关
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build APK
        run: |
          cd my_video_player
          # 强制清理：删除所有可能导致冲突的文件
          rm -rf android/.gradle
          rm -f android/app/build.gradle.kts
          rm -f android/build.gradle.kts
          rm -f android/settings.gradle.kts
          flutter pub get
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-private-player
          path: my_video_player/build/app/outputs/flutter-apk/app-release.apk