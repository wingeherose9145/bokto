name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Hard Reset and Build
        run: |
          cd my_video_player
          
          # 1. 物理删除整个 android 文件夹（防止旧格式残留）
          rm -rf android
          
          # 2. 重新创建纯净的安卓外壳
          flutter create . --platforms=android
          
          # 3. 这里的关键：检查并强制删除可能再次生成的 .kts 干扰项（如果存在）
          # 我们统一使用标准配置，不给冲突留机会
          flutter pub get
          
          # 4. 执行打包，并针对 AGP 9 的警告添加免检
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-private-player
          path: my_video_player/build/app/outputs/flutter-apk/app-release.apk